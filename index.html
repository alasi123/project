<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
    <style>
        body {
            body {
            background-color: #ADD8E6; 
}
}

        table { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        button { margin: 5px; padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-success { background-color: #4CAF50; color: white; }
        .btn-warning { background-color: #ff9800; color: white; }
        .btn-danger { background-color: #f44336; color: white; }
        form { margin-bottom: 20px; font-family: Arial, sans-serif; }
        label { display: inline-block; width: 100px; margin-bottom: 10px; }
        input { margin-bottom: 10px; padding: 8px; width: calc(100% - 120px); border: 1px solid #ccc; border-radius: 4px; }

        /* تصميم النموذج (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            width: 300px;
        }
        .modal-content h2 {
            margin-top: 0;
        }
        .modal-content button {
            margin-top: 10px;
        }
        .modal .btn.btn-dark:hover {
            background-color: red;
        }
        .modal .btn.btn-link:hover {
            background-color: green;
        }
        .btn-success:hover {
            background-color: blue;
        }
    </style>
    <link rel="website icon" href="HR-career.avif">
</head>
<body>
    

    <h2>Employee List</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Position</th>
                <th>Department</th>
                <th>Email</th>
                <th>Salaries</th>
                <th>performance</th>
                <th>Actions</th>
                
            </tr>
        </thead>
        <tbody id="employeeTable"></tbody>
    </table>

    <h2>Add New Employee</h2>
    <form id="addEmployeeForm">
        <label for="newId">ID:</label>
        <input type="text" id="newId" required><br><br>
        
        <label for="newName">Name:</label>
        <input type="text" id="newName" required><br><br>

        <label for="newPosition">Position:</label>
        <input type="text" id="newPosition" required><br><br>

        <label for="newDepartment">Department:</label>
        <input type="text" id="newDepartment" required><br><br>

        <label for="newEmail">Email:</label>
        <input type="email" id="newEmail" required><br><br>

        <label for="newSalary">Salary:</label>
        <input type="text" id="newSalary" required><br><br>
        <label for="editPerformance">Performance:</label>
        <input type="text" id="editPerformance" required><br><br>

        <button type="button" class="btn btn-success" onclick="addEmployee()">Add Employee</button>
    </form>

    <!-- نموذج التعديل (Modal) -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>Edit Employee</h2>
            <form id="editForm">
                <label for="editId">ID:</label>
                <input type="text" id="editId" readonly><br><br>
                
                <label for="editName">Name:</label>
                <input type="text" id="editName" required><br><br>

                <label for="editPosition">Position:</label>
                <input type="text" id="editPosition" required><br><br>

                <label for="editDepartment">Department:</label>
                <input type="text" id="editDepartment" required><br><br>

                <label for="editEmail">Email:</label>
                <input type="email" id="editEmail" required><br><br>

                <label for="editSalary">Salary:</label>
                <input type="text" id="editSalary" required><br><br>
                <label for="">performance:</label>
                <input type="text" id="performance" ><br><br>
                
                <button type="button" class="btn btn-dark" onclick="saveChanges()">Save Changes</button>
                <button type="button" class="btn btn-link" onclick="closeModal()">Cancel</button>
        
            </form>
        </div>
    </div>

    <script>
        // بيانات الموظفين الأولية
        let employees = [
            { id: 1, name: "John Doe", position: "Software Engineer", department: "IT", email: "john.doe@example.com", salary: "$1000" ,performance:""},
            { id: 2, name: "Jane Smith", position: "HR Manager", department: "HR", email: "jane.smith@example.com", salary: "$1200",performance:"" },
            { id: 3, name: "Amro", position: "Python Developer", department: "PD", email: "amro@gmail.com", salary: "$1100",performance:"" }
        ];

        // عرض الجدول عند تحميل الصفحة
        renderTable();

        // دالة لعرض الجدول
        function renderTable() {
            const table = document.getElementById('employeeTable');
            table.innerHTML = employees.map(employee => `
                <tr>
                    <td>${employee.id}</td>
                    <td>${employee.name}</td>
                    <td>${employee.position}</td>
                    <td>${employee.department}</td>
                    <td>${employee.email}</td>
                    <td>${employee.salary}</td>
                    <td>${employee.performance}</td>
                    <td>
                    <button type="button" class="btn btn-warning" onclick="openEditModal(${employee.id})">Edit</button>
                    <button type="button" class="btn btn-danger" onclick="deleteEmployee(${employee.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        // دالة لإضافة موظف جديد
        function addEmployee() {
            const id = document.getElementById('newId').value;
            const name = document.getElementById('newName').value;
            const position = document.getElementById('newPosition').value;
            const department = document.getElementById('newDepartment').value;
            const email = document.getElementById('newEmail').value;
            const salary = document.getElementById('newSalary').value;
            const performance = document.getElementById('editPerformance').value;

            if (!id || !name || !position || !department || !email || !salary ) {
                alert("All fields are required!");
                return;
            }

            // التحقق من عدم تكرار الـ ID
            if (employees.some(emp => emp.id == id)) {
                alert("Employee ID must be unique!");
                return;
            }

            employees.push({ id, name, position, department, email, salary ,performance});
            renderTable();
            document.getElementById('addEmployeeForm').reset();
        }

        // دالة لفتح نموذج التعديل
        function openEditModal(id) {
            const employee = employees.find(emp => emp.id == id);
            if (employee) {
                document.getElementById('editId').value = employee.id;
                document.getElementById('editName').value = employee.name;
                document.getElementById('editPosition').value = employee.position;
                document.getElementById('editDepartment').value = employee.department;
                document.getElementById('editEmail').value = employee.email;
                document.getElementById('editSalary').value = employee.salary;
                document.getElementById('editPerformance').value = employee.performance;

                // عرض النموذج
                document.getElementById('editModal').style.display = 'flex';
            }
        }

        // دالة لحفظ التعديلات
        function saveChanges() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value;
            const position = document.getElementById('editPosition').value;
            const department = document.getElementById('editDepartment').value;
            const email = document.getElementById('editEmail').value;
            const salary = document.getElementById('editSalary').value;
            const performance = document.getElementById('performance').value;

            const employee = employees.find(emp => emp.id == id);
            if (employee) {
                employee.name = name;
                employee.position = position;
                employee.department = department;
                employee.email = email;
                employee.salary = salary;
                employee.performance = performance;
            }

            renderTable();
            closeModal();
        }

        // دالة لإغلاق النموذج
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // دالة لحذف موظف
        function deleteEmployee(id) {
            if (confirm("Are you sure you want to delete this employee?")) {
                employees = employees.filter(emp => emp.id != id);
                renderTable();
            }
        }
    </script>

</body>
</html>
